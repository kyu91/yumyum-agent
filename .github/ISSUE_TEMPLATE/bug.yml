name: Bug report
description: Report a reproducible YumYum problem without sensitive data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, local paths, raw stderr, private files, or captures. For security issues, follow SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and CPU
      placeholder: macOS 14.x, Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: cli
    attributes:
      label: Local CLI
      options: [Not applicable, Hermes, OpenCode, Codex, Claude Code]
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, personal data, local paths, raw stderr, and private captures.
          required: true
        - label: I noted any security, privacy, permission, or external-change impact above.
          required: true
