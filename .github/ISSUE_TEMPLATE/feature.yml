name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem should YumYum solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
      description: Describe the minimum behavior that would solve it.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety and privacy impact
      description: Note input, storage, network, permissions, external changes, and upstream CLI effects.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: This request contains no secrets, personal data, private files, or captures.
          required: true
