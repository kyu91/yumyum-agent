name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.2 and verify Swift
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          SWIFT_MAJOR=$(swift --version | sed -nE 's/.*Swift version ([0-9]+).*/\1/p')
          test "$SWIFT_MAJOR" -ge 6
      - name: Diagnostics
        run: |
          uname -m
          sw_vers
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Verify app bundle
        run: |
          test -x ".build/YumYum Agent.app/Contents/MacOS/YumYum"
          test -x ".build/YumYum Agent.app/Contents/Resources/yumyum-process-fixture"
          /usr/bin/cmp AppBundle/Info.plist ".build/YumYum Agent.app/Contents/Info.plist"
          test "$(/usr/bin/find ".build/YumYum Agent.app/Contents" -type f | LC_ALL=C /usr/bin/sort | /usr/bin/wc -l | /usr/bin/tr -d ' ')" = 3
