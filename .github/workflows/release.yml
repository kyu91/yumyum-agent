name: Signed Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string
      commit:
        description: Exact 40-character commit SHA the tag must resolve to
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Select Xcode 26.6 and verify Swift
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          XCODE_VERSION=$(xcodebuild -version | sed -nE 's/^Xcode ([0-9.]+)$/\1/p')
          test "$XCODE_VERSION" = 26.6
          SWIFT_MAJOR=$(swift --version | sed -nE 's/.*Swift version ([0-9]+).*/\1/p')
          test "$SWIFT_MAJOR" -ge 6
      - name: Validate tag and source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -eu
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          printf '%s\n' "$RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' AppBundle/Info.plist)
          test "$RELEASE_TAG" = "v${VERSION}"
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          test "$TAG_COMMIT" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          swift build
          swift test

  release:
    needs: build-and-test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Select Xcode 26.6 and verify Swift
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          XCODE_VERSION=$(xcodebuild -version | sed -nE 's/^Xcode ([0-9.]+)$/\1/p')
          test "$XCODE_VERSION" = 26.6
          SWIFT_MAJOR=$(swift --version | sed -nE 's/.*Swift version ([0-9]+).*/\1/p')
          test "$SWIFT_MAJOR" -ge 6
      - name: Validate tag, source, and bundle identifier
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -eu
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          printf '%s\n' "$RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' AppBundle/Info.plist)
          test "$RELEASE_TAG" = "v${VERSION}"
          TAG_COMMIT=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          test "$TAG_COMMIT" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' AppBundle/Info.plist)
          if [ "$BUNDLE_ID" = kr.yumyum.phase0 ]; then
            echo 'The temporary CFBundleIdentifier is not releasable.' >&2
            exit 1
          fi
          case "$BUNDLE_ID" in
            ''|.*|*.|*..*|*[!A-Za-z0-9.-]*) echo 'CFBundleIdentifier is empty or invalid.' >&2; exit 1 ;;
            *.*) ;;
            *) echo 'CFBundleIdentifier must use reverse-DNS form.' >&2; exit 1 ;;
          esac
          test "$BUNDLE_ID" = io.github.kyu91.yumyumagent
      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -eu
          umask 077
          KEYCHAIN_PASSWORD=$(/usr/bin/openssl rand -hex 32)
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/developer-id.p12"
          chmod 600 "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/release.keychain-db" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
      - name: Create notarized universal release
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          umask 077
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          VERSION=${RELEASE_TAG#v}
          ARCHITECTURES='arm64 x86_64' \
          APPLE_NOTARY_PRIVATE_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" \
          ./scripts/package-release.sh --version "$VERSION"
      - name: Verify release artifact
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          VERSION=${RELEASE_TAG#v}
          EXPECTED_ARCHITECTURES='arm64 x86_64' SIGNED_RELEASE=true \
          ./scripts/test-release.sh ".build/release/YumYum-Agent-${VERSION}-macOS.dmg"
      - name: Upload and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -eu
          VERSION=${RELEASE_TAG#v}
          DMG_NAME="YumYum-Agent-${VERSION}-macOS.dmg"
          CHECKSUM_NAME="${DMG_NAME}.sha256"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          if RELEASE_STATE=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'select(.isDraft == true and .isPrerelease == false) | "reusable"' 2>/dev/null); then
            test "$RELEASE_STATE" = reusable || {
              echo "Release $RELEASE_TAG already exists and is not a stable draft." >&2
              exit 1
            }
            ASSET_STATE=$(gh release view "$RELEASE_TAG" --json assets --jq ".assets | select(all(.name == \"$DMG_NAME\" or .name == \"$CHECKSUM_NAME\")) | \"allowed-assets\"")
            test "$ASSET_STATE" = allowed-assets || {
              echo "Release $RELEASE_TAG contains an unexpected asset." >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              --title "YumYum Agent ${VERSION}" \
              --verify-tag
          fi
          gh release upload "$RELEASE_TAG" \
            ".build/release/$DMG_NAME" \
            ".build/release/$CHECKSUM_NAME" \
            --clobber
          ASSET_STATE=$(gh release view "$RELEASE_TAG" --json assets --jq ".assets | select(length == 2 and ([.[] | select(.name == \"$DMG_NAME\")] | length) == 1 and ([.[] | select(.name == \"$CHECKSUM_NAME\")] | length) == 1) | \"exact-assets\"")
          test "$ASSET_STATE" = exact-assets
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
